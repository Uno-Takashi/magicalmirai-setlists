# セットリスト。曲名は dataset/songs.yaml のキーと一致させること。
# 出典: 公式サイト アフターレポート https://magicalmirai.com/2021/special_afterreport.html
#
# shows は「その候補がどの公演回で演奏されたか」。performance は edition.yaml の
# 公演 id、day はその公演の何日目か、session は昼夜 (区別が無い年は書かない)。
# 省略した枠はその公演すべてで演奏された固定曲。
# 会場替わり / 日程替わり / 日替わり の区別は、この shows から計算する。
