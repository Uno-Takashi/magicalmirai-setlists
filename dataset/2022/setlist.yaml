        song: 'ブレス・ユア・ブレス'
        singers: [miku]
      - order: 4
        variants:
          - song: 'おこちゃま戦争'
            shows:
              - osaka/day1-evening
              - osaka/day3-evening
              - osaka/day3-matinee
              - tokyo/day1-evening
              - tokyo/day1-matinee
              - tokyo/day3-evening
              - tokyo/day3-matinee
