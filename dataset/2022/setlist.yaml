# セットリスト。曲名は dataset/songs.yaml のキーと一致させること。
# 出典: 公式サイト アフターレポート https://magicalmirai.com/10th/special_afterreport.html
#
# shows は「その候補がどの公演回で演奏されたか」。edition.yaml の
# <公演 id>/<公演回 id> を指す。省略した枠はその公演すべてで演奏された固定曲。
# 会場替わり / 日程替わり / 日替わり の区別は、この shows から計算する。
sets:
  - performances: [osaka, tokyo]
    tracks:
      - order: 1
        song: 'ネクストネスト'
        singers: [miku]
      - order: 2
        song: 'ヴァンパイア'
        singers: [miku]
