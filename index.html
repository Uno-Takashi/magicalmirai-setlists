<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>マジカルミライ 歴代セットリスト</title>
    <meta
      name="description"
      content="初音ミク「マジカルミライ」歴代公演のセットリストを振り返るための、非公式サイトです。"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="%VITE_SITE_URL%" />

    <!-- OGP -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="マジカルミライ 歴代セットリスト" />
    <meta property="og:title" content="マジカルミライ 歴代セットリスト" />
    <meta
      property="og:description"
      content="初音ミク「マジカルミライ」歴代公演のセットリストを年ごとに振り返るファンアーカイブ。"
    />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="zh_TW" />
    <meta property="og:locale:alternate" content="ko_KR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="マジカルミライ 歴代セットリスト" />
    <meta
      name="twitter:description"
      content="初音ミク「マジカルミライ」歴代公演のセットリストを年ごとに振り返るファンアーカイブ。"
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%ogp.png" />

    <meta name="theme-color" content="#39C5BB" />
    <meta name="color-scheme" content="light" />

    <!-- 構造化データ。検索結果でサイト名と検索窓を出せるようにする。 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "%VITE_SITE_URL%#website",
        "name": "マジカルミライ 歴代セットリスト",
        "alternateName": "Magical Mirai Setlist Archive",
        "url": "%VITE_SITE_URL%",
        "description": "初音ミク「マジカルミライ」歴代公演のセットリストを、公演・日程ごとに振り返れるサイト。",
        "inLanguage": ["ja", "en", "zh-Hant", "ko"],
        "about": {
          "@type": "MusicEvent",
          "name": "マジカルミライ",
          "performer": { "@type": "MusicGroup", "name": "初音ミク" }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
